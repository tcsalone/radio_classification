[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-classifier"
version = "0.1.0"
description = "Local terrestrial radio classifier: RTL-SDR + audfprint + YAMNet + faster-whisper + Ollama, with SQLite analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "pydantic>=2.0",
  "faster-whisper>=1.0.0",
  "datasketch>=1.6.0",
  "setuptools>=65.0.0,<82",
]

[project.optional-dependencies]
acoustic = [
  "tensorflow>=2.13.0",
  "tensorflow-hub>=0.14.0",
]
gpu = [
  # CUDA shared libraries needed on WSL2 by:
  #   * CTranslate2 / faster-whisper (Tier 3): cudart, cublas, cudnn
  #   * TensorFlow / YAMNet (Tier 2):          cufft, cusolver, cusparse
  # The Windows driver exposes the device while these user-space libs are
  # missing from the Linux environment by default. radio_classifier.gpu
  # dlopen()s them with RTLD_GLOBAL so both frameworks can resolve them
  # without LD_LIBRARY_PATH games.
  "nvidia-cuda-runtime-cu12>=12.0",
  "nvidia-cublas-cu12>=12.0",
  "nvidia-cudnn-cu12>=9.0",
  "nvidia-cufft-cu12>=11.0",
  "nvidia-cusolver-cu12>=11.0",
  "nvidia-cusparse-cu12>=12.0",
  # nvcc provides libdevice.10.bc which TF/XLA JIT needs at runtime even
  # though we never call the nvcc compiler ourselves.
  "nvidia-cuda-nvcc-cu12>=12.0",
]
fingerprint = [
  # audfprint is not packaged for pip (PyPI or direct Git).
  # Install it as an external CLI tool; see README "Install audfprint".
]
shazam = [
  "shazamio>=0.7.0",
]
seeding = [
  "yt-dlp>=2024.1.1",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
radio-classifier = "radio_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "network: tests that require outbound network access",
  "gpu: tests that require an NVIDIA GPU",
  "slow: tests that take more than a few seconds",
]
# webrtcvad still imports pkg_resources (upstream); noise only until they migrate.
filterwarnings = [
  "ignore:pkg_resources is deprecated:UserWarning",
  "ignore:Couldn't find ffmpeg:RuntimeWarning",
  "ignore:.*audioop.*:DeprecationWarning",
]
